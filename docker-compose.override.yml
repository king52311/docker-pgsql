{
  "services": {
    "postgres": {
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ],
        "interval": "30s",
        "timeout": "10s",
        "start_period": "30s",
        "retries": 3
      }
    },
    "pgadmin": {
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:80/misc/ping', timeout=5).status == 200"
        ],
        "interval": "30s",
        "timeout": "10s",
        "start_period": "30s",
        "retries": 3
      }
    }
  }
}
