services:
  postgres:
    # 替换为此镜像，它基于 postgres:16 并且已经编译安装好了 pgvector
    image: pgvector/pgvector:pg16
    container_name: pgsql-vector-server
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234!asdf
      POSTGRES_DB: findme_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"                    # 限制日志大小，防止撑爆磁盘
        max-file: "3"
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-web
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@snuday.com  # pgAdmin 登录账号
      PGADMIN_DEFAULT_PASSWORD: 1234!asdf    # pgAdmin 登录密码
      TZ: Asia/Shanghai
    ports:
      - "8080:80"                          # 通过宿主机 8080 端口访问 Web 界面
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres